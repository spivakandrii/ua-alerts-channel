name: Air alerts

on:
  # Основний тригер: cron-job.org викликає GitHub API (workflow_dispatch) щохвилини.
  workflow_dispatch:
  # Запасний тригер, якщо cron-job.org недоступний (GitHub запускає не частіше ніж раз на 5 хв і з затримками).
  schedule:
    - cron: '*/5 * * * *'

# Запуски не перекриваються: поки триває один, наступний чекає в черзі.
concurrency:
  group: air-alerts
  cancel-in-progress: false

permissions:
  contents: write   # щоб публікувати docs/status.json для PWA

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: node check-alerts.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          REGIONS: ${{ vars.REGIONS }}

      # Стан змінився — публікуємо його (GitHub Pages оновить сайт) і розсилаємо push.
      - if: steps.check.outputs.changed == 'true'
        name: Publish status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json
          git commit -m "Оновлення статусу тривог" || exit 0
          git push

      - if: steps.check.outputs.changed == 'true' && hashFiles('changes.json') != '' && vars.SUBS_API != ''
        name: Send Web Push
        run: npm install --no-save --silent web-push@3 && node send-push.mjs
        env:
          SUBS_API: ${{ vars.SUBS_API }}
          PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
